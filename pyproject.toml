# pyproject.toml
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skyway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "python-dateutil>=2.8",
    "scipy>=1.16",
    "astropy>=7.1",
    "healpy>=1.19",
    "ephem>=4.2",
    "fitsio>=1.2",
    "matplotlib>=3.10",
    "cartopy>=0.25",
    "seaborn>=0.13",
    "imageio>=2.37",
    "torch>=2.7",
    "gymnasium>=1.2",
    "pydantic>=2.0",
    "einops>=0.8",
    "PyYAML>=6.0",
    "tqdm>=4.67",
    "skybright @ git+https://github.com/ehneilsen/skybright.git@b0e2d7e6e25131393ee76ce334ce1df1521e3659",
]

[tool.setuptools.packages.find]
include = ["skyway*"]

[project.scripts]
build-train-lookups = "skyway.scripts.build_train_lookups:main"
run-train = "skyway.scripts.train:main"
run-eval = "skyway.scripts.evaluate:main"
run-model-compare = "skyway.scripts.compare_models:main"
run-offline-scheduler = "skyway.scripts.run_offline_scheduler:main"
run-live-scheduler = "skyway.scripts.run_live_scheduler:main"
run-explain = "skyway.scripts.run_explain:main"
precompute-train-features = "skyway.scripts.precompute_features:main"

[tool.setuptools.package-data]
"skyway" = ["configs/*.json", "configs/*.yaml", "configs/templates/*.yaml", "blanco/*.conf",
              "models/aliases.yml", "models/*/configs/*.yaml", "models/*/checkpoints/model.pt"]
"skyway.configs" = ["*.json"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end tests that load a deployable model and roll out a night (deselect with -m 'not slow')"]
